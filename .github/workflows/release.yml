name: Build installers

# Runs when you push a version tag like v1.0.0.
# Builds the Linux .deb and Windows setup .exe as downloadable artifacts.
# The release on the public repo is then published from your machine:
#   gh run download --dir /tmp/artifacts
#   gh release create v1.0.0 --repo <you>/doc-alchemist /tmp/artifacts/*/*

on:
  push:
    tags: ["v*"]

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: sudo apt-get update -qq && sudo apt-get install -y pandoc
      - name: Generate themes
        run: python3 make_themes.py
      - name: Build .deb
        run: ./build_deb.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandoc
        run: choco install pandoc -y
      - name: Generate themes
        run: python make_themes.py
      - name: Stamp version info
        run: >
          python -c "import json, os; json.dump({'version': os.environ['GITHUB_REF_NAME'].lstrip('v'), 'repo': os.environ['GITHUB_REPOSITORY_OWNER'] + '/doc-alchemist'}, open('app_info.json', 'w'))"
      - name: Install build deps
        run: pip install pyinstaller "markitdown[pdf,docx]" tkinterdnd2 fpdf2 markdown docx2pdf
      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name DocAlchemist
          --icon assets/icon.ico
          --add-data "themes;themes"
          --add-data "assets;assets"
          --add-data "app_info.json;."
          --collect-all tkinterdnd2
          --collect-all markitdown
          --collect-all magika
          --hidden-import docx2pdf
          --hidden-import simple_pdf
          --hidden-import markdown
          --collect-all fpdf
          app-windows.pyw
      - name: Build installer
        shell: cmd
        run: |
          for /f "tokens=1 delims=v" %%v in ("%GITHUB_REF_NAME:~1%") do set VER=%%v
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /DMyAppVersion=%GITHUB_REF_NAME:~1% installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/DocAlchemist-Setup-*.exe
