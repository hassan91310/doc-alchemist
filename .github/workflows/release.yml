name: Build installers

# Runs when you push a version tag like v1.0.0.
# Builds the Linux .deb and Windows setup .exe, then publishes them
# as a release on the public downloads repository.

on:
  push:
    tags: ["v*"]

env:
  # the public repo where installers are published
  RELEASES_REPO: YOURUSER/doc-alchemist

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: sudo apt-get update -qq && sudo apt-get install -y pandoc
      - name: Generate themes
        run: python3 make_themes.py
      - name: Build .deb
        run: ./build_deb.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandoc
        run: choco install pandoc -y
      - name: Generate themes
        run: python make_themes.py
      - name: Install build deps
        run: pip install pyinstaller "markitdown[pdf,docx]" tkinterdnd2
      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name DocAlchemist
          --icon assets/icon.ico
          --add-data "themes;themes"
          --add-data "assets;assets"
          --collect-all tkinterdnd2
          --collect-all markitdown
          app-windows.pyw
      - name: Build installer
        shell: cmd
        run: |
          for /f "tokens=1 delims=v" %%v in ("%GITHUB_REF_NAME:~1%") do set VER=%%v
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /DMyAppVersion=%GITHUB_REF_NAME:~1% installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/DocAlchemist-Setup-*.exe

  publish:
    needs: [build-deb, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish release on public repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Doc Alchemist ${{ github.ref_name }}
          body: |
            ## Downloads

            | OS | File |
            |----|------|
            | Linux Mint / Ubuntu | `doc-alchemist_*_all.deb` |
            | Windows 10 / 11 | `DocAlchemist-Setup-*.exe` |

            **Linux:** download the .deb and double-click it (or run
            `sudo apt install ./doc-alchemist_*_all.deb`). All required
            packages are installed automatically.

            **Windows:** download and run the setup exe. It offers to
            install pandoc and LibreOffice for you.
          files: |
            deb/*.deb
            windows/*.exe
